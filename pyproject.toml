[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-aero-bench"
version = "0.1.0"
description = "Benchmark NIST post-quantum primitives (ML-KEM, ML-DSA, SLH-DSA, Falcon) against real-world aviation datalink constraints (ACARS, VDL-2, ADS-B, LDACS, SATCOM, AeroMACS)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Thirukumaran Senthilkumaran", email = "thirukumaranarun@gmail.com" }]
keywords = ["pqc", "post-quantum", "aviation", "cybersecurity", "ml-kem", "ml-dsa", "kyber", "dilithium", "falcon", "sphincs", "acars", "ads-b", "ldacs", "avionics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "quantcrypt>=1.0.1",
    "cryptography>=42.0.0",
    "matplotlib>=3.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[project.scripts]
pqc-aero-bench = "pqc_aero_bench.cli:main"

[project.urls]
Homepage = "https://github.com/Thirukumaran-Senthilkumaran/pqc-aero-bench"
Issues = "https://github.com/Thirukumaran-Senthilkumaran/pqc-aero-bench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
